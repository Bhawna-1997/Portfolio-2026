<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhawna Nagpal — Digital Product Designer</title>
  <meta name="description" content="Digital Product Designer who vibe codes. Currently designing at Zeta." />

  <!-- Theme (must run before paint to avoid a flash) -->
  <script src="theme.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__logo">BN</a>
    <div class="nav__links">
      <a href="index.html#work" class="nav__link">Work</a>
      <a href="play.html" class="nav__link">Play</a>
      <a href="about.html" class="nav__link">About</a>
      <button class="theme-toggle" id="themeToggle" type="button" role="switch"
              aria-checked="false" aria-label="Switch to light theme" title="Light mode">
        <span class="theme-toggle__knob" aria-hidden="true">
          <svg class="theme-toggle__glyph theme-toggle__glyph--moon" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.6 9.9A5.9 5.9 0 0 1 6.1 2.4a5.9 5.9 0 1 0 7.5 7.5Z"/>
          </svg>
          <svg class="theme-toggle__glyph theme-toggle__glyph--sun" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="3.1"/>
            <path d="M8 1.2v1.5M8 13.3v1.5M14.8 8h-1.5M2.7 8H1.2M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1M12.8 12.8l-1.1-1.1M4.3 4.3 3.2 3.2"/>
          </svg>
        </span>
      </button>
      <a href="#" class="nav__cta" target="_blank" rel="noopener">Resume ↗</a>
    </div>
  </nav>

  <!-- Fixed animated background — persists through hero + carousel -->
  <div class="hero__floor" aria-hidden="true">
    <div class="hero__floor-grid"></div>
  </div>
  <div class="hero__horizon-fade" aria-hidden="true"></div>

  <!-- Hero intro -->
  <section class="hero" id="hero">

    <div class="hero__content" id="heroContent">
      <div class="hero__portrait" id="heroPortrait">
        <img class="hero__portrait-layer hero__portrait-layer--sketch" src="Assets/bhawna-portrait.png" alt="Bhawna Nagpal" width="320" height="320" />
        <!-- The photo behind it — same person, so it's decorative and kept out
             of the reading order; hover crossfades it in. -->
        <img class="hero__portrait-layer hero__portrait-layer--photo" src="Assets/bhawna-portrait-photo.png" alt="" aria-hidden="true" width="320" height="320" />
      </div>

      <p class="hero__intro" id="heroIntro">Hey, I am Bhawna, a senior product designer</p>

      <h1 class="hero__title" id="heroTitle">designing with <span class="hero__hl hero__hl--craft">craft</span>, <span class="hero__hl hero__hl--think">thinking,</span> and a bias to <span class="hero__hl hero__hl--build">build</span></h1>

    </div>

    <div class="hero__scroll" id="heroScroll">
      <div class="hero__scroll-pill">
        <div class="hero__scroll-dot" id="heroScrollDot"></div>
      </div>
    </div>

    <!-- Carousel overlay — sits inside pinned hero so it appears within the same viewport -->
    <div class="carousel-section" id="carouselSection">
      <div class="carousel-inner" id="carouselInner">
        <p class="text-label carousel__eyebrow">Selected Work</p>
        <div class="carousel-3d" id="carousel3d">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>
        <div class="carousel-nav">
          <button class="carousel-nav__btn" id="carouselPrev" aria-label="Previous">←</button>
          <div class="carousel-dots" id="carouselDots"></div>
          <button class="carousel-nav__btn" id="carouselNext" aria-label="Next">→</button>
        </div>
      </div>
    </div>

  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="text-label">Get in touch</p>
    <h2 class="site-footer__heading">Let's build something together</h2>
    <a class="site-footer__email" href="mailto:bhawnanagpal37@gmail.com">bhawnanagpal37@gmail.com</a>
  </footer>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/CustomEase.min.js"></script>
  <script src="animation.js"></script>
  <script src="content.js"></script>
</body>
</html>
